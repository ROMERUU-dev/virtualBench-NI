[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vbarrido-py"
version = "0.1.0"
description = "Replica en Python del barrido frecuencial VBarrido/LabVIEW"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "tomli>=2.0; python_version < '3.11'",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
hardware = ["pyvirtualbench @ git+https://github.com/armstrap/armstrap-pyvirtualbench.git"]

[project.scripts]
vbarrido = "vbarrido_py.cli:main"
vbarrido-gui = "vbarrido_py.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
